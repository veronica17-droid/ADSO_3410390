    <main>
        <header>
            <h1>01-Events</h1>
            <h5>Handle user interactions with event listeners.</h5>
        </header>
        <section>
            <div class="house">
                <div class="info">
                    Press arrow keys: <br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div class="controls">
                    <button class="btn-left">&larr;</button>
                    <button class="btn-up">&uarr;</button>
                    <button class="btn-right">&rarr;</button>
                    <button class="btn-down">&darr;</button>
                </div>
                <div id="trainer" class="down">

                </div>
            </div>
        </section>
        

    </main>
    <Script>
        //Elements
        const trainer = document.getElementById("trainer");
        const btnLeft = document.querySelector(".btn-left");
        const btnUp = document.querySelector(".btn-up");
        const btnRight = document.querySelector(".btn-right");
        const btnDown = document.querySelector(".btn-down");
        

        //Events
        btnLeft.addEventListener("click", function(){
            this.style.pointerEvents = "none";
            this.style.opacity = "0.4";
            trainer.className = "left";
        });
        btnUp.addEventListener("click", function(){
            this.style.pointerEvents = "none";
            this.style.opacity = "0.4";
            trainer.className = "up";
        });
        btnRight.addEventListener("click", function(){
            this.style.pointerEvents = "none";
            this.style.opacity = "0.4";
            trainer.className = "right";
        });
        btnDown.addEventListener("click", function(){
            this.style.pointerEvents = "none";
            this.style.opacity = "0.4";
            trainer.className = "down";
        });
        

        //keyup = levanto el dedo de la tecla
        // document.addEventListener("keyup", function(event){
        //     if(event.key == "ArrowLeft"){
        //         trainer.className = "left";
        //     }else if(event.key == "ArrowUp"){
        //         trainer.className = "up";
        //     }else if(event.key == "ArrowRight"){
        //         trainer.className = "right";
        //     }else if(event.key == "ArrowDown"){
        //         trainer.className = "down"; 
        //     }
        // });
        document.addEventListener("keyup", function(event){
            // console.log(event.key);
            // console.log(event-keycode);
            switch (event.keyCode) {
                case 37: //left
                trainer.className = "left";
                break;
                case 38: //Up
                trainer.className = "up";
                break;
                case 39: //Right
                trainer.className = "right";
                break;
                case 40: //Down
                trainer.className = "down";
                break;
            }
        });
        
        document.addEventListener("scrollY", function(event){
            console.log(event.key);
            console.log(event-keycode);
            if (event.key == "ScrollY") {
                alert("hello");
            }
        });
    </Script>
